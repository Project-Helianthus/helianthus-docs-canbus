name: documentation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest==9.0.2
      - run: python3 scripts/check_naming_contract.py
      - run: python3 -m pytest tests/test_naming_contract.py -q -p no:cacheprovider --basetemp=${{ github.workspace }}/.tmp/pt

  validate:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: ./scripts/check_docs.sh
      - run: ./scripts/test_docs_gate.sh
      - run: python3 scripts/validate_gree_protocols.py
      - run: ./scripts/test_gree_protocols.sh
